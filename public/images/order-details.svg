  </g>

  <!-- Crop Item Card -->
  <g transform="translate(16, 192)">
    <rect width="382" height="152" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- Thumbnail -->
    <g transform="translate(16, 16)">
      <clipPath id="od1"><rect width="70" height="70" rx="10"/></clipPath>
      <g clip-path="url(#od1)">
  <defs>
    <radialGradient id="capGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="60%" stop-color="#D92800"/>
      <stop offset="100%" stop-color="#801500"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#1C1816"/>
  <path d="M30 40 C30 25 45 28 50 32 C55 28 70 25 70 40 C72 60 62 82 50 82 C38 82 28 60 30 40 Z" fill="url(#capGrad)"/>
  <path d="M48 32 C48 20 54 18 56 15" stroke="#48782E" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="42" cy="48" rx="5" ry="12" fill="#FFA58F" opacity="0.6"/>
</g>
    </g>
    
    <text x="98" y="34" font-family="sans-serif" font-size="15" font-weight="800" fill="#111827">Capsicum</text>
    <text x="98" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#087F4E">5.0 kg @ Rs. 100.00/kg</text>
    <text x="98" y="70" font-family="sans-serif" font-size="11" fill="#4B5563">Harvest Date: 2026-10-02</text>
    <text x="98" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#087F4E">Farmer: Sunil Bandara</text>
    
    <line x1="16" y1="102" x2="366" y2="102" stroke="#F3F4F6" stroke-width="1"/>
    <text x="16" y="122" font-family="sans-serif" font-size="10" font-weight="700" fill="#4B5563">Order Timeline</text>
    <text x="16" y="138" font-family="sans-serif" font-size="11" fill="#6B7280">🕒 Placed: 2 Oct 2026, 10:46 PM</text>
  </g>

  <!-- Chat with Farmer Card -->
  <g transform="translate(16, 356)">
    <rect width="382" height="116" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#E5F4EA"/>
    <path d="M26 26h14v8h-4l-3 3z" fill="#087F4E"/>
