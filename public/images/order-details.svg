    </g>
    <text x="36" y="18" font-family="sans-serif" font-size="17" font-weight="800" fill="#111827">ORD-261002-7546</text>
    <g transform="translate(346, 2)" stroke="#087F4E" stroke-width="2" fill="none">
      <path d="M2 3h16v10H6l-4 4z"/>
    </g>
  </g>

  <!-- Order Status Card -->
  <g transform="translate(16, 84)">
