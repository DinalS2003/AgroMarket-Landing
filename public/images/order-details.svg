      <rect x="20" y="3" width="6" height="7" rx="0.5" fill="#202124" />
      <rect x="22" y="0" width="2" height="1" fill="#202124" />
    </g>
  </g>


  <!-- App Bar -->
  <g transform="translate(16, 44)">
