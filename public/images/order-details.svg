    <text x="16" y="54" font-family="sans-serif" font-size="12" fill="#4B5563">Harvest (5.0 kg x Rs. 100.00)</text>
    <text x="296" y="54" font-family="sans-serif" font-size="12" font-weight="600" fill="#111827">Rs. 500.00</text>

    <text x="16" y="80" font-family="sans-serif" font-size="12" fill="#4B5563">Delivery Fee (buyer_arranged)</text>
    <text x="320" y="80" font-family="sans-serif" font-size="12" font-weight="600" fill="#111827">Rs. 0.00</text>
    
    <line x1="16" y1="96" x2="366" y2="96" stroke="#E5E7EB" stroke-width="1"/>

    <text x="16" y="122" font-family="sans-serif" font-size="14" font-weight="800" fill="#111827">Total Order Amount</text>
    <text x="286" y="122" font-family="sans-serif" font-size="15" font-weight="800" fill="#087F4E">Rs. 500.00</text>
  </g>

  <!-- Awaiting Acceptance Banner -->
